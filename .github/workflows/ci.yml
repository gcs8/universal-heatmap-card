name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every push to main gets its own group (run_id) so a merge burst cannot cancel
# the post-merge run of an earlier main commit; PR and branch runs still
# supersede each other. Main has no required check, so post-merge evidence is
# the only record that a main commit was verified.
concurrency:
  group: universal-heatmap-card-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm run ci:guard
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- dist/universal-heatmap-card.js

  validate-hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main as reviewed 2026-05-17
        with:
          category: plugin
